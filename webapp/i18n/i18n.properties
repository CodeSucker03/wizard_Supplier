text1 = Nhà thầu cam kết tất cả thông tin được cung cấp dưới đây là đúng sự thật, chính xác và Nhà thầu hiểu rằng thông tin này là những thông tin quan trọng trong việc đánh giá năng lực của Nhà thầu đối với mỗi hồ sơ chào giá, hồ sơ dự thầu và đề xuât của Nhà thầu với VPBank.
text2 = Xin lưu ý rằng Qúy đối tác phải thông báo bằng văn bản cho VPBank về bất kì sự thay đổi nào liên quan đến các thông tin đã cung cấp trong vòng mười(10) ngày kể từ ngày các thay đổi đó có hiệu lực.Nếu VPBank phát hiện bất cứ thay đổi nào mà không được thông báo thì Qúy đối tác có thể bị loại trong các gói thầu tham gia và bị VPBank toàn quyền chấm dứt Hợp đồng vô điều kiện mà không phải chịu bất cứ trách nhiệm, nghĩa vụ nào do lỗi chậm cập nhật, không đảm bảo thông tin được chính xác, kịp thời này của Qúy đối tác.
text3 = Chúng tôi sẽ sử dụng các thông tin (Họ và tên,số CCCD,Ngày tháng năm sinh...) của các cá nhân mà Qúy công ty đã cung cấp trong biểu mẫu này cho mục đích kiểm tra Phòng Chống Rửa Tiền theo Quy định của luật Phòng Chống Rửa Tiền hiện hành.Qúy công ty có trách nhiệm đảm bảo đã nhận được sự đồng ý từ các cá nhân này để thực hiện cung cấp Thông tin cho VPBank theo biểu mẫu này.
text4 = Vendor hereby affirms that all information provided is true and accurate, and understands that this information is important in evaluating for each quotation, bid, and proposal to VPBank.
text5 = Please note that you shall have to provide VPBank with a written notice of any changes regarding/on the povided information within ten(10) days from the day the changes have taken effect.If VPBank detects any changes without notice,you may be disqualified from participating bidding packages and VPBank has the right to unconditionaly terminal the Contract without any liability, any obligations due to your mistake of late update and not guarantee accurately and timely the information.
text6 = We would like to inform that we will use the information(Full name, ID card number, Date of birth...) of the individuals that you have provided in this form for the purpose of Anti-Money Laundering Inspection in accordance with the current Anti-Money Laundering Law.You shall be responsible for receiving consents from these individuals to provide Information to VPBank in this Form.
